<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP9 Student Survey</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .modal {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 320px;
    }
    .modal h3 { margin-top: 0; font-size: 1.2rem; color: #1a73e8; }
    .modal p { color: #555; font-size: 0.9rem; margin-bottom: 20px; line-height: 1.4; }
    .btn-container { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
    }
    .accept { background-color: #1a73e8; color: white; }
    .decline { border: 1px solid #1a73e8; background: white; color: #1a73e8; }
    
    .privacy-link {
      color: #7c4dff;
      text-decoration: underline;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-block;
    }

    /* Jump Scare Container */
    #scare-screen {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: black;
      z-index: 9999;
    }

    /* Shake Animation */
    .active-scare {
      animation: shake 0.05s infinite;
    }

    /* Dedicated Color Inversion Animation */
    #scare-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: colorInvert 0.08s infinite, zoomPulse 0.15s infinite alternate;
    }

    /* Rapid Hard Invert (Negative Effect) */
    @keyframes colorInvert {
      0%, 49.9% {
        filter: invert(0%) contrast(100%);
      }
      50%, 100% {
        filter: invert(100%) contrast(200%) hue-rotate(180deg);
      }
    }

    /* Screen Shake */
    @keyframes shake {
      0% { transform: translate(8px, 8px) rotate(0deg); }
      20% { transform: translate(-8px, -8px) rotate(-2deg); }
      40% { transform: translate(-8px, 8px) rotate(2deg); }
      60% { transform: translate(8px, -8px) rotate(0deg); }
      80% { transform: translate(8px, 8px) rotate(2deg); }
      100% { transform: translate(-8px, -8px) rotate(-2deg); }
    }

    /* Zoom Effect */
    @keyframes zoomPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <!-- Fake Academic Survey Modal -->
  <div class="modal" id="cookie-modal">
    <h3>AP9 Student Survey</h3>
    <p>Please accept cookies to proceed to the Araling Panlipunan 9 evaluation form.</p>
    <div class="btn-container">
      <button class="btn accept" onclick="popScare()">Accept</button>
      <button class="btn decline" onclick="popScare()">Decline</button>
    </div>
    <a class="privacy-link" onclick="popScare()">Privacy policy</a>
  </div>

  <!-- Jump Scare Screen -->
  <div id="scare-screen">
    <img id="scare-img" src="scare.jpg" alt="AP9">
    <audio id="scream-sound" src="scream.mp3"></audio>
  </div>

  <script>
    function popScare() {
      // Fullscreen Trigger
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      }

      // Display scare
      document.getElementById('cookie-modal').style.display = 'none';
      const scareScreen = document.getElementById('scare-screen');
      scareScreen.style.display = 'block';
      scareScreen.classList.add('active-scare');
      
      // Play Audio
      const audio = document.getElementById('scream-sound');
      audio.play();
    }
  </script>
</body>
</html>
